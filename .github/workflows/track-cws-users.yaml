name: Track Chrome Web Store users

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-cws-users
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Track users
        run: node scripts/track-cws-users.mjs

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/cws-users.json assets/cws-users.svg
          git diff --cached --quiet || git commit -m "chore: update Chrome Web Store user stats"
          git push
